<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HALWAN HOSPITAL - Jaipur</title>
<style>
*{box-sizing:border-box;font-family:system-ui,Arial,sans-serif}
body{margin:0;background:#eef2f7;color:#111}
header{background:#0b3d91;color:#fff;padding:16px;text-align:center;position:sticky;top:0;z-index:10}
header h1{margin:0;font-size:22px;letter-spacing:1px}
header p{margin:4px 0 0;opacity:.9;font-size:13px}
.wrap{max-width:900px;margin:auto;padding:14px}
.card{background:#fff;border-radius:14px;padding:16px;box-shadow:0 4px 14px rgba(0,0,0,.08);margin-bottom:14px}
h2{margin:0 0 12px;font-size:18px}
label{font-size:13px;font-weight:700;display:block;margin-top:10px}
input,select,textarea{width:100%;padding:11px;border:1px solid #ccc;border-radius:10px;margin-top:5px;font-size:15px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:600px){.row{grid-template-columns:1fr}}
.btn{width:100%;padding:13px;border:0;border-radius:10px;background:#0b3d91;color:#fff;font-size:16px;font-weight:800;margin-top:14px;cursor:pointer}
.btn-green{background:#128c4a}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.stat{background:#f1f5ff;border-radius:12px;padding:12px;text-align:center}
.stat b{font-size:22px;display:block}
.stat span{font-size:12px;color:#555}
.search{margin-bottom:10px}
.patient{border:1px solid #e5e5e5;border-radius:12px;padding:12px;margin-bottom:10px;background:#fbfbfb}
.patient b{font-size:16px}
.meta{font-size:13px;color:#555;margin:4px 0}
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:12px;font-weight:700}
.waiting{background:#fff3cd;color:#7a5a00}
.done{background:#d1f5dd;color:#0a6b2e}
.small-btn{padding:8px 10px;border-radius:8px;border:0;cursor:pointer;font-weight:700;margin-right:6px;margin-top:8px}
.print{background:#111;color:#fff}
.del{background:#ffe1e1;color:#a00}
.top-flex{display:flex;gap:8px}
.top-flex button{flex:1}
</style>
</head>
<body>
<header>
<h1>🏥 HALWAN HOSPITAL</h1>
<p>Jaipur, Rajasthan | OPD • Patient • Billing</p>
</header>

<div class="wrap">

<div class="card stats">
<div class="stat"><b id="totalP">0</b><span>Total Patient</span></div>
<div class="stat"><b id="waitP">0</b><span>Waiting</span></div>
<div class="stat"><b id="totalAmt">₹0</b><span>Total Collection</span></div>
</div>

<div class="card">
<h2>➕ Naya Patient Add Karo</h2>
<label>Patient Ka Naam *</label>
<input id="pName" placeholder="Jaise - Ramesh Kumar">
<div class="row">
<div><label>Age</label><input id="pAge" type="number" placeholder="35"></div>
<div><label>Phone Number</label><input id="pPhone" type="tel" placeholder="98765 43210"></div>
</div>
<div class="row">
<div><label>Gender</label>
<select id="pGender"><option>Male</option><option>Female</option><option>Other</option></select></div>
<div><label>Fees (₹)</label><input id="pFees" type="number" placeholder="200"></div>
</div>
<label>Problem / Bimari</label>
<textarea id="pProblem" rows="2" placeholder="Bukhar, Khansi, Pet Dard..."></textarea>
<label>Doctor</label>
<select id="pDoctor"><option>Dr. Halwan</option><option>Dr. General OPD</option><option>Dr. Duty</option></select>
<button class="btn" onclick="addPatient()">✅ PATIENT ADD KARO</button>
</div>

<div class="card">
<h2>📋 Aaj Ke Patient</h2>
<input class="search" id="searchBox" oninput="render()" placeholder="🔍 Naam ya Phone se dhoondho...">
<div class="top-flex">
<button class="small-btn" onclick="filter='all';render()" style="background:#0b3d91;color:#fff">Sab</button>
<button class="small-btn" onclick="filter='waiting';render()" style="background:#ffc107">Waiting</button>
<button class="small-btn" onclick="filter='done';render()" style="background:#128c4a;color:#fff">Done</button>
</div>
<div id="list"></div>
<button class="btn btn-green" onclick="window.print()">🖨️ LIST PRINT KARO</button>
</div>

<div class="card" style="text-align:center;font-size:13px;color:#666">
HALWAN HOSPITAL • Jaipur • Data isi Phone / Browser me Save rehta hai<br>
Emergency me turant Doctor ko batayein
</div>

</div>

<script>
let patients = JSON.parse(localStorage.getItem('halwan_patients') || '[]');
let filter = 'all';

function save(){ localStorage.setItem('halwan_patients', JSON.stringify(patients)); }
function addPatient(){
  let name = document.getElementById('pName').value.trim();
  if(!name){ alert('Pehle Patient ka Naam likho'); return; }
  let p = {
    id: Date.now(),
    name: name,
    age: document.getElementById('pAge').value || '-',
    phone: document.getElementById('pPhone').value || '-',
    gender: document.getElementById('pGender').value,
    fees: Number(document.getElementById('pFees').value || 0),
    problem: document.getElementById('pProblem').value || 'General Checkup',
    doctor: document.getElementById('pDoctor').value,
    status: 'waiting',
    time: new Date().toLocaleString('hi-IN')
  };
  patients.unshift(p); save(); render();
  document.getElementById('pName').value='';
  document.getElementById('pAge').value='';
  document.getElementById('pPhone').value='';
  document.getElementById('pFees').value='';
  document.getElementById('pProblem').value='';
  alert('✅ Patient Add Ho Gaya - ' + name);
}
function toggleDone(id){
  let p = patients.find(x=>x.id===id);
  p.status = p.status==='waiting' ? 'done' : 'waiting';
  save(); render();
}
function delPatient(id){
  if(confirm('Ye Patient hatana hai?')){ patients = patients.filter(x=>x.id!==id); save(); render(); }
}
function render(){
  let q = document.getElementById('searchBox').value.toLowerCase();
  let list = patients.filter(p=>{
    if(filter!=='all' && p.status!==filter) return false;
    if(q && !(p.name.toLowerCase().includes(q) || p.phone.includes(q))) return false;
    return true;
  });
  document.getElementById('totalP').innerText = patients.length;
  document.getElementById('waitP').innerText = patients.filter(p=>p.status==='waiting').length;
  document.getElementById('totalAmt').innerText = '₹' + patients.reduce((s,p)=>s+p.fees,0);
  let box = document.getElementById('list');
  if(list.length===0){ box.innerHTML = '<p style="text-align:center;color:#888">Abhi koi Patient nahi hai.</p>'; return; }
  box.innerHTML = list.map(p=>`
    <div class="patient">
      <b>${p.name}</b> <span class="badge ${p.status==='waiting'?'waiting':'done'}">${p.status==='waiting'?'⏳ WAITING':'✅ DONE'}</span>
      <div class="meta">Age: ${p.age} | ${p.gender} | 📞 ${p.phone}</div>
      <div class="meta">🩺 ${p.problem} | 👨‍⚕️ ${p.doctor}</div>
      <div class="meta">💰 Fees: ₹${p.fees} | 🕒 ${p.time}</div>
      <button class="small-btn" style="background:#128c4a;color:#fff" onclick="toggleDone(${p.id})">${p.status==='waiting'?'Done Karo':'Wapas Waiting'}</button>
      <button class="small-btn del" onclick="delPatient(${p.id})">Delete</button>
    </div>
  `).join('');
}
render();
</script>
</body>
</html>
